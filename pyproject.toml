[project]
name = "fraud-detection"
version = "0.1.0"
description = "Détection de fraude bancaire (XGBoost) — projet d'apprentissage MLOps"
readme = "README.md"
authors = [
    { name = "Luc YAO" }
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.136.3",
    "imbalanced-learn>=0.14.0",
    "joblib>=1.6.0",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.2",
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "shap>=0.54.1",
    "uvicorn>=0.54.0",
    "xgboost>=3.4.1",
]

[project.scripts]
fraud-detection = "fraud_detection:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: tests de bout en bout (entraînement complet sur données synthétiques)"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E/F : erreurs de base, I : tri des imports, B : bugs fréquents, UP : syntaxe moderne
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true  # xgboost, imblearn, mlflow... n'ont pas tous des stubs
