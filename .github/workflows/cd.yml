# Livraison continue : construit l'image Docker de l'API avec le modèle indiqué
# dans configs/serving.yaml, la teste, puis la publie sur GitHub Container Registry.
#   - pull request : build + test du conteneur, sans publication
#   - push sur main : build + test + publication sur ghcr.io
name: CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Sur une PR, un nouveau push annule le build en cours ; sur main, chaque
# publication va jusqu'au bout.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  image:
    name: Image Docker
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # publier sur ghcr.io avec le GITHUB_TOKEN, sans secret à créer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # 1. Quel modèle déployer ? C'est écrit dans Git, pas décidé par la CI.
      - name: Lire la version du modèle à déployer
        id: model
        run: echo "release=$(awk '/^model_release:/ {print $2}' configs/serving.yaml)" >> "$GITHUB_OUTPUT"

      - name: Télécharger le modèle depuis la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE: ${{ steps.model.outputs.release }}
        run: |
          gh release download "$MODEL_RELEASE" --pattern model.tar.gz
          tar -xzf model.tar.gz
          cat model/metadata.json

      # 2. Noms de l'image : sha-<commit> toujours, latest sur main, et le nom du modèle.
      - name: Calculer les tags de l'image
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.model.outputs.release }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # 3. Build local (pas encore publié), avec le cache de GitHub Actions.
      - name: Construire l'image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: fraud-detection-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. On ne publie jamais une image qui n'a pas démarré et répondu correctement.
      - name: Tester le conteneur
        env:
          MODEL_RELEASE: ${{ steps.model.outputs.release }}
        run: |
          docker run -d --name api -p 8000:8000 fraud-detection-api:test
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          echo
          curl -sf localhost:8000/health | python3 -c "
          import json, os, sys
          health = json.load(sys.stdin)
          expected = os.environ['MODEL_RELEASE'].removeprefix('model-v')
          assert str(health['model_version']) == expected, f'modèle {health[\"model_version\"]} chargé, {expected} attendu'
          print('Version du modèle OK :', expected)
          "
          # Une transaction d'exemple enregistrée par MLflow avec le modèle
          python3 -c "
          import json
          ex = json.load(open('model/input_example.json'))
          print(json.dumps(dict(zip(ex['columns'], ex['data'][0]))))
          " > transaction.json
          curl -sf -X POST localhost:8000/predict -H 'Content-Type: application/json' -d @transaction.json
          echo
          docker logs api
          docker rm -f api

      # 5. Publication, uniquement sur main.
      - name: Se connecter à ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Publier l'image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
