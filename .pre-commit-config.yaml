# Vérifications lancées automatiquement à chaque `git commit`.
# Installation (une fois) : uv run pre-commit install
# Lancer à la main sur tout le projet : uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files  # bloque un CSV de 144 Mo commité par erreur
        args: ["--maxkb=1000"]
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # ruff et mypy viennent de l'environnement uv : mêmes versions qu'en local et en CI (uv.lock).
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src
        language: system
        types: [python]
        pass_filenames: false
